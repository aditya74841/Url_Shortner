<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Link chain icon: two overlapping rounded rectangles -->
  <g stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none">
    <!-- left link -->
    <rect x="5" y="13" width="10" height="6" rx="3"/>
    <!-- right link -->
    <rect x="17" y="13" width="10" height="6" rx="3"/>
    <!-- connecting bar -->
    <line x1="15" y1="16" x2="17" y2="16"/>
  </g>
</svg>
