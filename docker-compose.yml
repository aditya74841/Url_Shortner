services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:6-alpine
    container_name: url_shortner_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Event Queue Container
  redis:
    image: redis:7-alpine
    container_name: url_shortner_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Fastify URL Shortener API Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortner_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/urlshortener
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      WORKERS_COUNT: 4
      BASE_URL: http://localhost:5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  redis-data:
